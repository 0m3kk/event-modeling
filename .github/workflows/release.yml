name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm run lint

      - name: Run type check
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm run test

  release-macos:
    name: Build macOS (ARM64)
    needs: test
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      TARGET: aarch64-apple-darwin
      ARCH: aarch64
      CI: true
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
      VITE_GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.VITE_GOOGLE_DESKTOP_CLIENT_ID }}
      VITE_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.VITE_GOOGLE_DESKTOP_CLIENT_SECRET }}
      VITE_GOOGLE_ACCESS_TOKEN: ${{ secrets.VITE_GOOGLE_ACCESS_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-all-crates: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # When triggered by manual dispatch: build Tauri app without creating/updating a GitHub release
      - name: Build Tauri app (Manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: tauri-apps/tauri-action@v1
        with:
          args: '--target ${{ env.TARGET }} --ignore-version-mismatches'
          tauriScript: 'pnpm tauri'

      # When triggered by a GitHub Release: build Tauri app and upload assets directly to that release
      - name: Build Tauri app and upload to release
        if: github.event_name == 'release'
        uses: tauri-apps/tauri-action@v1
        with:
          releaseId: ${{ github.event.release.id }}
          tagName: ${{ github.event.release.tag_name }}
          args: '--target ${{ env.TARGET }} --ignore-version-mismatches'
          tauriScript: 'pnpm tauri'

      # Upload artifacts to GitHub Actions run summary (workflow_dispatch only)
      - name: Upload build artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: event-modeling-macos-${{ env.ARCH }}
          path: src-tauri/target/${{ env.TARGET }}/release/bundle/dmg/*.dmg
          if-no-files-found: warn
          retention-days: 14

      # Add artifact info to Job Summary (workflow_dispatch only)
      - name: Add build artifact to summary
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "## 📦 Build Artifacts (${{ env.ARCH }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Architecture:** \`${{ env.ARCH }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Target:** \`${{ env.TARGET }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact Name:** \`event-modeling-macos-${{ env.ARCH }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Generated Files:" >> $GITHUB_STEP_SUMMARY
          for file in src-tauri/target/${{ env.TARGET }}/release/bundle/dmg/*.dmg; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              size=$(ls -lh "$file" | awk '{print $5}')
              echo "- 💿 \`$filename\` ($size)" >> $GITHUB_STEP_SUMMARY
            fi
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> 💡 You can download the artifact package in the **Artifacts** section at the bottom of this summary." >> $GITHUB_STEP_SUMMARY

      # Add release confirmation to Job Summary (release event only)
      - name: Add release info to summary
        if: github.event_name == 'release'
        run: |
          echo "## 🚀 Released to GitHub" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Release:** [${{ github.event.release.name || github.event.release.tag_name }}](${{ github.event.release.html_url }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag:** \`${{ github.event.release.tag_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Architecture:** \`${{ env.ARCH }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Target:** \`${{ env.TARGET }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Artifacts have been uploaded directly to the GitHub Release." >> $GITHUB_STEP_SUMMARY
