name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      releaseDraft:
        description: 'Create draft release'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Mark as prerelease'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm run lint

      - name: Run type check
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm run test

  release-macos:
    name: Build macOS (${{ matrix.arch }})
    needs: test
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: aarch64
            args: '--target aarch64-apple-darwin --ignore-version-mismatches'
          - target: x86_64-apple-darwin
            arch: x86_64
            args: '--target x86_64-apple-darwin --ignore-version-mismatches'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: true
        with:
          tagName: v__VERSION__
          releaseName: 'Event Modeling v__VERSION__'
          releaseBody: |
            ### Event Modeling v__VERSION__
            
            Download the appropriate `.dmg` for your Mac:
            - **Apple Silicon (M1/M2/M3/M4)**: `*aarch64.dmg`
            - **Intel Macs**: `*x64.dmg`
            
            > **macOS Note (Unsigned App)**:
            > Because this release is not signed with an Apple Developer certificate, macOS Gatekeeper may show a warning on first launch.
            > - To open: Right-click (or Control-click) the app in your Applications folder and select **Open**.
            > - Or run in Terminal: `xattr -cr /Applications/"Event Modeling.app"`
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' && inputs.releaseDraft || false }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          args: ${{ matrix.args }}
          tauriScript: 'pnpm tauri'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: event-modeling-macos-${{ matrix.arch }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
          if-no-files-found: warn
          retention-days: 14
