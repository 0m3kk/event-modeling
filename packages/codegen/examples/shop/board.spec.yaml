name: Shop
domains:
  - name: Sales
    cards:
      - PlaceOrder
      - OrderPlaced
      - OrderService
      - GetOrder
      - OrderState
  - name: Shipping
    cards:
      - ShipOrder
      - OrderShipped
      - OrderShippingView

slices:
  - name: Place order
    domain: Sales
  - name: Ship order
    domain: Shipping

types:
  - object: Order
    fields:
      - name: id
        type: OrderId
      - name: status
        type: Status
      - name: total
        type: float
        required: true
        validation:
          min: 0
  - alias: OrderId
    of: string
  - alias: Timestamp
    of: string
  - enum: Status
    values:
      - pending
      - paid
      - shipped

events:
  - name: OrderPlaced
    description: Emitted when a customer places an order.
    fields:
      - name: order
        type: Order
      - name: placedAt
        type: Timestamp
        tag: order
  - name: OrderShipped
    fields:
      - name: orderId
        type: OrderId
        tag: order
      - name: shippedAt
        type: Timestamp

commands:
  - name: PlaceOrder
    action: sales:placeOrder
    description: Place a new order.
    inputs:
      - name: orderId
        type: OrderId
        required: true
      - name: items
        type: string
        array: true
  - name: ShipOrder
    action: shipping:shipOrder
    inputs:
      - name: orderId
        type: OrderId
        required: true

queries:
  - name: GetOrder
    action: sales:getOrder
    params:
      - name: orderId
        type: OrderId
        required: true

services:
  - name: OrderService
    description: Order lifecycle.
    methods:
      - name: place
        params:
          - name: orderId
            type: OrderId
        returns:
          - name: orderId
            type: OrderId

views:
  - name: OrderShippingView
    description: Shipping details of an order.
    params:
      - name: orderId
        type: OrderId
    query:
      - types:
          - OrderShipped
        tags:
          - tag: order
            field: orderId
    states:
      - name: shippedAt
        type: Timestamp

states:
  - name: OrderState
    description: Decision model for a single order.
    params:
      - name: orderId
        type: OrderId
    query:
      - types:
          - OrderPlaced
          - OrderShipped
        tags:
          - tag: order
            field: orderId
    states:
      - name: status
        type: Status
      - name: total
        type: float

tags:
  - tag: order
    types:
      - OrderId
    fromEvents:
      - OrderPlaced
      - OrderShipped
