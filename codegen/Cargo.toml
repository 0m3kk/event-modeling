[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/rust",
    "crates/cli",
]
exclude = ["generated"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/nhatpm/event-modeling"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
heck = "0.5"
minijinja = "2"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
thiserror = "2"
