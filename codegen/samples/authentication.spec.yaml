name: Authentication
domains:
  - name: account
    groups:
      - accountTypes
      - accountStates
    slices:
      - registerAccount
      - sendActivationEmail
      - activateAccount
      - suspendAccount
      - unsuspendAccount
      - deleteAccount
  - name: totp
    groups:
      - totpTypes
      - totpStates
    slices:
      - enrollTotp
      - confirmTotpEnrollment
      - verifyTotpCode
      - disableTotp
      - viewTotpStatus
  - name: recoveryCodes
    groups:
      - recoveryCodesTypes
      - recoveryCodesStates
    slices:
      - regenerateRecoveryCodes
      - verifyRecoveryCode
  - name: passkey
    groups:
      - passkeyTypes
      - passkeyStates
    slices:
      - verifyPasskeySecondFactor
      - loginWithPasskey
      - viewPasskeys
      - registerSecondFactorPasskey
      - registerLoginPasskey
      - deletePasskey
      - createPasskeyCreationOptions
      - createPasskeyRequestOptions
  - name: twoFactor
    groups:
      - twoFactorStates
      - twoFactorTypes
  - name: password
    groups:
      - passwordTypes
      - passwordStates
    slices:
      - changePassword
      - requestPasswordReset
      - resetPassword
      - verifyPassword
    cards:
      - passwordInitialized
  - name: session
    groups:
      - sessionTypes
      - sessionStates
    slices:
      - createSession
      - revokeSession
groups:
  - name: accountTypes
    domain: account
    cards:
      - email
      - password
      - accountStatus
  - name: accountStates
    domain: account
    cards:
      - accountRegistry
      - pendingActivation
      - accountActivation
      - accountLifecycle
  - name: actors
    cards:
      - guest
      - system
      - admin
      - accountOwner
  - name: totpTypes
    domain: totp
    cards:
      - totpSecret
      - totpCode
      - totpStatus
  - name: totpStates
    domain: totp
    cards:
      - totpEnrollment
      - totpVerification
  - name: recoveryCodesTypes
    domain: recoveryCodes
    cards:
      - recoveryCode
  - name: recoveryCodesStates
    domain: recoveryCodes
    cards:
      - recoveryCodeInventory
  - name: passkeyTypes
    domain: passkey
    cards:
      - passkeyStatus
      - passkeyPurpose
      - passkeyCredentialId
      - passkeyPublicKey
      - passkeyChallenge
      - passkeyCredential
      - passkeyPolicy
      - userVerificationRequirement
      - residentKeyRequirement
      - authenticatorAttachment
      - attestationConveyance
      - passkeyCreationOptions
      - passkeyRequestOptions
      - passkeyOptionType
  - name: passkeyStates
    domain: passkey
    cards:
      - passkeyEnrollment
      - passkeyAuthentication
  - name: twoFactorStates
    domain: twoFactor
    cards:
      - secondFactorEnrollment
  - name: twoFactorTypes
    domain: twoFactor
    cards:
      - recoveryCodeIssueState
  - name: passwordTypes
    domain: password
    cards:
      - passwordResetStatus
      - passwordResetToken
  - name: passwordStates
    domain: password
    cards:
      - passwordCredential
      - passwordResetRequest
      - passwordVerification
  - name: sessionTypes
    domain: session
    cards:
      - sessionId
      - loginMethod
      - sessionStatus
  - name: sessionStates
    domain: session
    cards:
      - sessionRecord
slices:
  - name: registerAccount
    domain: account
    description: A guest registers a new account using an email identity and a password.
    lanes:
      - type: Command
        cards:
          - registerAccount
      - type: Constraint
        cards:
          - emailMustBeUnique
      - type: Event
        cards:
          - accountRegistered
          - passwordInitialized
  - name: sendActivationEmail
    domain: account
    description: Send an account activation email to a newly registered user via the account notification service.
    lanes:
      - type: Command
        cards:
          - sendActivationEmail
      - type: Constraint
        cards:
          - accountMustAwaitActivation
      - type: Event
        cards:
          - activationEmailSent
      - type: Service
        cards:
          - sendActivationEmail
  - name: activateAccount
    domain: account
    description: The owner opens the activation link from the email and turns the pending account into an activated one.
    lanes:
      - type: Command
        cards:
          - activateAccount
      - type: Constraint
        cards:
          - activationLinkMustBeValid
      - type: Event
        cards:
          - accountActivated
      - type: Service
        cards:
          - sendAccountActivatedEmail
  - name: suspendAccount
    domain: account
    description: Admin suspends an activated account, recording the reason
    lanes:
      - type: Command
        cards:
          - suspendAccount
      - type: Constraint
        cards:
          - accountMustBeActiveToSuspend
      - type: Event
        cards:
          - accountSuspended
      - type: Service
        cards:
          - sendAccountSuspendedEmail
  - name: unsuspendAccount
    domain: account
    description: Admin lifts a suspension and restores the account, recording the reason
    lanes:
      - type: Command
        cards:
          - unsuspendAccount
      - type: Constraint
        cards:
          - accountMustBeSuspendedToUnsuspend
      - type: Event
        cards:
          - accountUnsuspended
      - type: Service
        cards:
          - sendAccountUnsuspendedEmail
  - name: deleteAccount
    domain: account
    description: Admin permanently deletes an account, recording the reason
    lanes:
      - type: Command
        cards:
          - deleteAccount
      - type: Constraint
        cards:
          - accountMustNotBeDeleted
      - type: Event
        cards:
          - accountDeleted
      - type: Service
        cards:
          - sendAccountDeletedEmail
  - name: enrollTotp
    domain: totp
    description: Starts TOTP enrollment and issues the first batch of recovery codes in the same step.
    lanes:
      - type: Command
        cards:
          - enrollTotp
      - type: Constraint
        cards:
          - totpMustNotBeEnabled
      - type: Event
        cards:
          - totpEnrollmentRequested
  - name: confirmTotpEnrollment
    domain: totp
    description: The account proves possession of the authenticator with a first code and TOTP is turned on.
    lanes:
      - type: Command
        cards:
          - confirmTotpEnrollment
      - type: Constraint
        cards:
          - totpEnrollmentMustBePending
          - totpRecoveryCodesOnlyOnFirstFactor
      - type: Event
        cards:
          - totpEnabled
          - recoveryCodesGenerated
  - name: verifyTotpCode
    domain: totp
    description: Second-factor verification with a TOTP one-time code during sign-in.
    lanes:
      - type: Command
        cards:
          - verifyTotpCode
      - type: Constraint
        cards:
          - totpVerificationMustBeAllowed
      - type: Event
        cards:
          - totpCodeVerified
          - totpVerificationFailed
  - name: disableTotp
    domain: totp
    description: The account owner turns TOTP two-factor authentication off using a current code.
    lanes:
      - type: Command
        cards:
          - disableTotp
      - type: Constraint
        cards:
          - totpMustBeEnabledToDisable
      - type: Event
        cards:
          - totpDisabled
  - name: regenerateRecoveryCodes
    domain: recoveryCodes
    description: Issue a fresh recovery code set for an account that already has two-factor enabled
    lanes:
      - type: Command
        cards:
          - regenerateRecoveryCodes
      - type: Constraint
        cards:
          - recoveryCodesRequireEnabledTotp
      - type: Event
        cards:
          - recoveryCodesGenerated
  - name: viewTotpStatus
    domain: totp
    description: Read the two-factor status of one account
    lanes:
      - type: Query
        cards:
          - getTotpStatus
      - type: State
        cards:
          - totpLifecycle
  - name: verifyRecoveryCode
    domain: recoveryCodes
    description: Second-factor verification with a single-use recovery code during sign-in.
    lanes:
      - type: Command
        cards:
          - verifyRecoveryCode
      - type: Constraint
        cards:
          - recoveryCodeMustBeVerifiable
      - type: Event
        cards:
          - recoveryCodeUsed
          - recoveryCodeVerificationFailed
  - name: verifyPasskeySecondFactor
    domain: passkey
    description: Second-factor verification with a registered passkey during sign-in.
    lanes:
      - type: Command
        cards:
          - verifyPasskeySecondFactor
      - type: Constraint
        cards:
          - passkeySecondFactorMustBeAllowed
      - type: Event
        cards:
          - passkeyVerified
          - passkeyVerificationFailed
  - name: loginWithPasskey
    domain: passkey
    description: "Passwordless direct sign-in: the passkey alone authenticates the account."
    lanes:
      - type: Command
        cards:
          - loginWithPasskey
      - type: Constraint
        cards:
          - passkeyLoginMustBeAllowed
      - type: Event
        cards:
          - passkeyLoginSucceeded
          - passkeyLoginFailed
  - name: viewPasskeys
    domain: passkey
    description: Read flow that lists an account's passkeys with the query reading the registration, purpose-change and disable events; the read model is an in-memory state because passkey volume per account is small.
    lanes:
      - type: Query
        cards:
          - getPasskeys
      - type: State
        cards:
          - passkeyList
  - name: registerSecondFactorPasskey
    domain: passkey
    description: "Register a second-factor passkey: the command checks enrollment rules, verifies the attestation through passkeyService and announces the registered credential."
    lanes:
      - type: Command
        cards:
          - registerSecondFactorPasskey
      - type: Constraint
        cards:
          - secondFactorPasskeyRegistrationMustBeAllowed
      - type: Service
        cards:
          - verifyRegistration
      - type: Event
        cards:
          - secondFactorPasskeyRegistered
          - recoveryCodesGenerated
  - name: registerLoginPasskey
    domain: passkey
    description: "Register a passwordless login passkey: the command checks enrollment rules, verifies the attestation through passkeyService and announces the registered credential."
    lanes:
      - type: Command
        cards:
          - registerLoginPasskey
      - type: Constraint
        cards:
          - loginPasskeyRegistrationMustBeAllowed
      - type: Service
        cards:
          - verifyRegistration
      - type: Event
        cards:
          - loginPasskeyRegistered
  - name: deletePasskey
    domain: passkey
    description: An account owner permanently deletes one of their registered passkeys.
    lanes:
      - type: Command
        cards:
          - deletePasskey
      - type: Constraint
        cards:
          - deletablePasskeyMustExist
      - type: Event
        cards:
          - passkeyDeleted
  - name: changePassword
    domain: password
    description: A signed-in user replaces their current password with a new one
    lanes:
      - type: Command
        cards:
          - changePassword
      - type: Constraint
        cards:
          - passwordChangeMustBeAllowed
      - type: Event
        cards:
          - passwordChanged
  - name: requestPasswordReset
    domain: password
    description: "Flow: the user requests a password reset link. Validates the account, records the reset request token, then calls the email service to send the token to the user's inbox."
    lanes:
      - type: Command
        cards:
          - requestPasswordReset
      - type: Event
        cards:
          - passwordResetRequested
      - type: Service
        cards:
          - sendPasswordResetEmail
  - name: resetPassword
    domain: password
    description: A user consumes a valid reset link to set a new password
    lanes:
      - type: Command
        cards:
          - resetPassword
      - type: Constraint
        cards:
          - passwordResetMustBeValid
      - type: Event
        cards:
          - passwordResetCompleted
  - name: createPasskeyCreationOptions
    domain: passkey
    description: Builds WebAuthn creation options for a new passkey and parks them in temporary storage until the registration is verified. Publishes no domain event.
    lanes:
      - type: Command
        cards:
          - createPasskeyCreationOptions
      - type: Service
        cards:
          - buildCreationOptions
          - storeCreationOptions
  - name: createPasskeyRequestOptions
    domain: passkey
    description: Builds WebAuthn request options for an authentication ceremony and parks them in temporary storage until the assertion is verified. Publishes no domain event.
    lanes:
      - type: Command
        cards:
          - createPasskeyRequestOptions
      - type: Service
        cards:
          - buildRequestOptions
          - storeRequestOptions
  - name: verifyPassword
    domain: password
    description: Checks a submitted password against the account credential without creating a session.
    lanes:
      - type: Command
        cards:
          - verifyPassword
      - type: Constraint
        cards:
          - passwordVerificationMustBeAllowed
      - type: Event
        cards:
          - passwordVerified
          - passwordVerificationFailed
  - name: createSession
    domain: session
    description: Issues a new authenticated session for an account.
    lanes:
      - type: Command
        cards:
          - createSession
      - type: Constraint
        cards:
          - sessionCreationMustBeAllowed
      - type: Event
        cards:
          - sessionCreated
  - name: revokeSession
    domain: session
    description: An administrator revokes an existing session so it can no longer be used
    lanes:
      - type: Command
        cards:
          - revokeSession
      - type: Constraint
        cards:
          - sessionRevocationMustBeAllowed
      - type: Event
        cards:
          - sessionRevoked
types:
  - alias: email
    of: string
    description: Email address used as the unique login identity of an account.
    validation:
      maxLength: 254
      format: email
  - alias: password
    of: string
    description: Plain-text password supplied by the user at registration; it is only stored as a hash.
    validation:
      minLength: 8
      maxLength: 72
  - enum: accountStatus
    description: Lifecycle status of an account. A newly registered account always starts in pending and can only be used after it is activated.
    values:
      - name: pending
        description: Registered but not yet verified through the activation link sent by email; the account cannot sign in yet.
      - name: activated
        description: The email link has been used, the account is verified and fully usable.
      - name: suspended
        description: Access is temporarily blocked by an administrator; the identity is kept.
      - name: deleted
        description: The account is permanently closed and the email identity is released.
  - alias: totpSecret
    of: string
    description: Base32 shared secret used to derive TOTP one-time codes.
    validation:
      minLength: 16
      maxLength: 128
  - alias: totpCode
    of: string
    description: Six-digit one-time code generated by the authenticator app.
    validation:
      minLength: 6
      maxLength: 6
      pattern: ^[0-9]{6}$
  - enum: totpStatus
    description: Lifecycle status of an account's TOTP second factor.
    values:
      - name: pending
        description: Enrollment started, waiting for the first code to be confirmed.
      - name: enabled
        description: Two-factor authentication is active for the account.
      - name: disabled
        description: Two-factor authentication was turned off for the account.
      - name: lockedOut
        description: Verification is temporarily blocked after too many failed attempts.
  - alias: recoveryCode
    of: string
    description: A single one-time backup code that lets a user recover access when their TOTP authenticator is unavailable; it is consumed once used.
    validation:
      minLength: 8
      maxLength: 16
      pattern: ^[A-Z0-9-]+$
      rule: Uppercase alphanumeric characters only, optionally separated by dashes
  - enum: passkeyStatus
    description: Lifecycle status of a registered passkey credential.
    values:
      - name: pending
        description: Registration started but the authenticator attestation is not confirmed yet.
      - name: active
        description: Passkey is confirmed and can be used for sign-in.
      - name: disabled
        description: Passkey is turned off by the account owner and can no longer be used.
      - name: revoked
        description: Passkey is permanently revoked and can never be re-enabled.
  - enum: passkeyPurpose
    description: How the account intends to use a passkey credential.
    values:
      - name: secondFactor
        description: Passkey is used only as a second factor after the password step.
      - name: primaryLogin
        description: Passkey can sign the account in directly without a password.
  - alias: passkeyCredentialId
    of: string
    description: Base64url-encoded WebAuthn credential identifier of an authenticator.
    validation:
      minLength: 16
      maxLength: 1024
      rule: Base64url characters only, as produced by the authenticator
  - alias: passkeyPublicKey
    of: string
    description: Base64url-encoded COSE public key of the registered authenticator.
    validation:
      minLength: 32
      maxLength: 4096
  - alias: passkeyChallenge
    of: string
    description: Random single-use challenge the server issues for a WebAuthn ceremony.
    validation:
      minLength: 16
      maxLength: 256
      rule: Cryptographically random, valid only once
  - object: passkeyCredential
    description: A registered passkey credential belonging to an account.
    fields:
      - name: credentialId
        type: passkeyCredentialId
        required: true
        description: WebAuthn credential id of the authenticator.
      - name: publicKey
        type: passkeyPublicKey
        required: true
        description: Public key the authenticator signatures are verified against.
      - name: signCount
        type: integer
        required: true
        description: Latest signature counter reported by the authenticator.
      - name: deviceName
        type: string
        description: Human friendly label of the device that holds the passkey.
      - name: purpose
        type: passkeyPurpose
        required: true
        description: Whether the passkey works as second factor only or also as direct login.
      - name: status
        type: passkeyStatus
        required: true
        description: Current lifecycle status of the credential.
      - name: createdAt
        type: string
        description: When the credential was registered.
      - name: lastUsedAt
        type: string
        description: When the credential was last used successfully.
  - object: passkeyPolicy
    description: Configuration used to generate the WebAuthn options (creation options for registration, request options for authentication) that the browser/client hands to the authenticator.
    fields:
      - name: policyName
        type: string
        required: true
        description: Human readable name of the policy, e.g. 'default-web' or 'security-key-only'.
      - name: rpId
        type: string
        required: true
        description: Relying Party identifier the passkey is bound to (effective domain, e.g. 'example.com').
      - name: rpName
        type: string
        required: true
        description: Relying Party name shown in the authenticator prompt.
      - name: userVerification
        type: userVerificationRequirement
        required: true
        description: User verification level requested in the options (PIN/biometric required, preferred or discouraged).
      - name: residentKey
        type: residentKeyRequirement
        required: true
        description: Whether the credential must be discoverable on the authenticator; 'required' enables username-less login.
      - name: authenticatorAttachment
        type: authenticatorAttachment
        description: Restricts the ceremony to a platform authenticator (device biometrics) or a cross-platform security key; empty means any.
      - name: attestation
        type: attestationConveyance
        required: true
        description: Attestation conveyance requested while creating a credential.
      - name: algorithms
        type: integer
        array: true
        required: true
        description: COSE algorithm identifiers offered to the authenticator, e.g. -7 (ES256) and -257 (RS256).
        validation:
          minItems: 1
      - name: timeoutMs
        type: integer
        required: true
        description: How long the authenticator prompt may stay open before the ceremony times out, in milliseconds.
        validation:
          min: 10000
          max: 300000
      - name: challengeLengthBytes
        type: integer
        required: true
        description: Number of random bytes used to build the challenge embedded in the options.
        validation:
          min: 16
          max: 64
      - name: challengeTtlSeconds
        type: integer
        required: true
        description: How long the generated challenge stays valid and can be verified.
        validation:
          min: 30
          max: 600
  - enum: userVerificationRequirement
    description: How strongly the authenticator must verify the user (PIN/biometric) during a passkey ceremony.
    values:
      - name: required
        description: User verification is mandatory; the ceremony fails without PIN or biometric.
      - name: preferred
        description: User verification is requested but may be skipped by the authenticator.
      - name: discouraged
        description: User verification should not be performed (presence-only check).
  - enum: residentKeyRequirement
    description: Whether the passkey must be discoverable (stored on the authenticator) so it can be used without a username.
    values:
      - name: required
        description: The authenticator must store a discoverable (resident) credential — needed for username-less login.
      - name: preferred
        description: A discoverable credential is preferred but a server-side one is acceptable.
      - name: discouraged
        description: A server-side credential is expected; nothing is stored on the authenticator.
  - enum: authenticatorAttachment
    description: Which kind of authenticator may handle the passkey ceremony.
    values:
      - name: platform
        description: Built into the device (Touch ID, Windows Hello, Android biometrics).
      - name: crossPlatform
        description: A roaming authenticator such as a USB/NFC security key or a phone used as a key.
  - enum: attestationConveyance
    description: How much authenticator attestation information is requested during passkey registration.
    values:
      - name: none
        description: No attestation requested — the authenticator identity is not revealed.
      - name: indirect
        description: Attestation may be provided but anonymized.
      - name: direct
        description: The authenticator's own attestation certificate is requested.
      - name: enterprise
        description: Enterprise attestation may identify the specific authenticator model or device.
  - object: recoveryCodeIssueState
    description: Records whether a recovery code set has already been issued for one second-factor type, so each factor type issues codes at most once.
    fields:
      - name: factorType
        type: string
        required: true
        description: Second-factor type the recovery codes were issued for (e.g. totp, passkey).
      - name: issued
        type: boolean
        required: true
        description: True when a recovery code set was already issued for this factor type.
  - enum: passwordResetStatus
    description: Lifecycle status of a password reset request
    values:
      - name: pending
        description: Reset link issued and not used yet
      - name: completed
        description: Reset link already used to set a new password
      - name: expired
        description: Reset link is past its expiry time
  - alias: passwordResetToken
    of: string
    description: One-time token embedded in a password reset link; must be unguessable and single-use.
  - object: passkeyCreationOptions
    description: WebAuthn PublicKeyCredentialCreationOptions handed to the browser for registering a passkey. Built per attempt, kept only until the registration is verified.
    fields:
      - name: challenge
        type: passkeyChallenge
        required: true
        description: Random challenge the authenticator must sign, usable only once
      - name: rpId
        type: string
        required: true
        description: Relying party identifier the new credential is scoped to
      - name: rpName
        type: string
        required: true
        description: Human readable relying party name shown by the authenticator
      - name: userId
        type: string
        required: true
        description: Opaque user handle the authenticator stores alongside the credential
      - name: userName
        type: string
        required: true
        description: Account identifier shown in the authenticator's passkey picker
      - name: userVerification
        type: userVerificationRequirement
        required: true
        description: Whether user verification is required, preferred or discouraged
      - name: residentKey
        type: residentKeyRequirement
        required: true
        description: Whether the credential must be discoverable on the authenticator
      - name: authenticatorAttachment
        type: authenticatorAttachment
        description: Preferred authenticator kind, platform or cross-platform
      - name: attestation
        type: attestationConveyance
        required: true
        description: Attestation conveyance preference for the registration ceremony
      - name: algorithms
        type: integer
        array: true
        required: true
        description: Accepted COSE algorithm identifiers for the credential key
      - name: excludeCredentialIds
        type: passkeyCredentialId
        array: true
        description: Already registered credentials the authenticator must refuse to duplicate
      - name: timeoutMs
        type: integer
        required: true
        description: How long the browser may wait for the user to complete the ceremony
      - name: expiresAt
        type: string
        required: true
        description: Moment after which these options are rejected
  - object: passkeyRequestOptions
    description: WebAuthn PublicKeyCredentialRequestOptions handed to the browser for asserting an existing passkey. Built per attempt, kept only until the assertion is verified.
    fields:
      - name: challenge
        type: passkeyChallenge
        required: true
        description: Random challenge the authenticator must sign, usable only once
      - name: rpId
        type: string
        required: true
        description: Relying party identifier the assertion must be scoped to
      - name: allowCredentialIds
        type: passkeyCredentialId
        array: true
        required: true
        description: Credentials the authenticator is allowed to answer with
      - name: userVerification
        type: userVerificationRequirement
        required: true
        description: Whether user verification is required, preferred or discouraged
      - name: timeoutMs
        type: integer
        required: true
        description: How long the browser may wait for the user to complete the ceremony
      - name: expiresAt
        type: string
        required: true
        description: Moment after which these options are rejected
  - enum: passkeyOptionType
    description: Kind of WebAuthn ceremony a stored set of options belongs to.
    values:
      - name: creation
        description: Options built for a registration ceremony
      - name: request
        description: Options built for an authentication ceremony
  - alias: sessionId
    of: string
    description: Identifier of an authenticated session issued after a successful sign-in.
    validation:
      format: uuid
  - enum: loginMethod
    description: Credential type the user presented as the first authentication factor.
    values:
      - name: password
        description: Session obtained by verifying a password
      - name: passkey
        description: Session obtained with a passkey assertion
  - enum: sessionStatus
    description: Lifecycle status of an authenticated session.
    values:
      - name: active
        description: Session is valid and can be used
      - name: revoked
        description: Session was explicitly terminated
      - name: expired
        description: Session passed its expiry time
events:
  - name: accountRegistered
    description: Announces that a new account exists with its identity data and initial status; the credential itself is recorded by a separate password event.
    fields:
      - name: accountId
        type: string
        required: true
        tag: account
        description: Identifier of the newly registered account
      - name: email
        type: email
        required: true
        description: Email address that identifies the account
      - name: status
        type: accountStatus
        required: true
        description: Account status right after registration, normally pending
      - name: registeredAt
        type: string
        required: true
        description: Timestamp when the account was registered
  - name: activationEmailSent
    description: Emitted when an activation email with a one-time activation link is dispatched to a pending account.
    fields:
      - name: accountId
        type: string
        required: true
        tag: account
        description: Identifier of the account the activation email is sent to
      - name: email
        type: email
        required: true
        description: Destination address resolved from the pending activation state of the account
      - name: activationToken
        type: string
        required: true
        tag: activation
        description: One-time token embedded in the activation link, used to key the activation state directly
      - name: expiresAt
        type: string
        required: true
        description: Moment after which the activation link is no longer valid
      - name: sentAt
        type: string
        required: true
        description: Moment the activation email was dispatched
  - name: accountActivated
    description: Emitted when a pending account confirms its activation link and becomes active.
    fields:
      - name: accountId
        type: string
        required: true
        tag: account
        description: Identifier of the account that has been activated
      - name: email
        type: email
        required: true
        description: Email identity of the activated account
      - name: status
        type: accountStatus
        required: true
        description: Account status after activation, always activated
      - name: activationToken
        type: string
        required: true
        tag: activation
        description: One-time token that was consumed to activate the account
      - name: activatedAt
        type: string
        required: true
        description: Moment the account became active
  - name: accountSuspended
    description: An activated account has been suspended by an administrator
    fields:
      - name: accountId
        type: string
        required: true
        tag: account
        description: Identifier of the suspended account
      - name: email
        type: email
        required: true
        description: Email identity of the suspended account
      - name: status
        type: accountStatus
        required: true
        description: Account status after the change, expected to be suspended
      - name: reason
        type: string
        required: true
        description: Reason provided by the administrator for the suspension
      - name: suspendedAt
        type: string
        required: true
        description: Timestamp when the account was suspended
  - name: accountUnsuspended
    description: A suspended account has been restored by an administrator
    fields:
      - name: accountId
        type: string
        required: true
        tag: account
        description: Identifier of the restored account
      - name: email
        type: email
        required: true
        description: Email identity of the restored account
      - name: status
        type: accountStatus
        required: true
        description: Account status after the change, expected to be activated
      - name: reason
        type: string
        required: true
        description: Reason provided by the administrator for lifting the suspension
      - name: unsuspendedAt
        type: string
        required: true
        description: Timestamp when the suspension was lifted
  - name: accountDeleted
    description: An account has been permanently deleted by an administrator
    fields:
      - name: accountId
        type: string
        required: true
        tag: account
        description: Identifier of the deleted account
      - name: email
        type: email
        required: true
        description: Email identity the deleted account used
      - name: status
        type: accountStatus
        required: true
        description: Account status after the change, expected to be deleted
      - name: reason
        type: string
        required: true
        description: Reason provided by the administrator for deleting the account
      - name: deletedAt
        type: string
        required: true
        description: Timestamp when the account was deleted
  - name: totpEnrollmentRequested
    description: An account started TOTP enrollment and a shared secret was generated.
    fields:
      - name: accountId
        type: string
        required: true
        tag: account
        description: Identifier of the account that starts two-factor enrollment.
      - name: secret
        type: totpSecret
        required: true
        description: Base32 shared secret used to derive one-time codes.
      - name: provisioningUri
        type: string
        required: true
        description: otpauth:// URI rendered as the enrollment QR code.
      - name: period
        type: integer
        required: true
        description: Length in seconds of each one-time code step.
      - name: digits
        type: integer
        required: true
        description: Number of digits in each generated one-time code.
      - name: requestedAt
        type: string
        required: true
        description: Moment the enrollment was requested.
  - name: totpEnabled
    description: TOTP two-factor authentication became active for the account.
    fields:
      - name: accountId
        type: string
        required: true
        tag: account
        description: Identifier of the account that confirmed enrollment.
      - name: status
        type: totpStatus
        required: true
        description: Status of the second factor after confirmation.
      - name: enabledAt
        type: string
        required: true
        description: Moment two-factor authentication was switched on.
  - name: totpCodeVerified
    description: A submitted TOTP code matched, completing the second factor for a pending login session.
    fields:
      - name: accountId
        type: string
        required: true
        tag: account
        description: Account whose one-time code was verified
      - name: verifiedAt
        type: string
        required: true
        description: Timestamp of the successful code verification
  - name: totpVerificationFailed
    description: A submitted one-time code did not match the account secret.
    fields:
      - name: accountId
        type: string
        required: true
        tag: account
        description: Identifier of the account whose code was rejected.
      - name: failedAttempts
        type: integer
        required: true
        description: Number of consecutive failed attempts after this failure.
      - name: failedAt
        type: string
        required: true
        description: Moment the code was rejected.
  - name: totpDisabled
    description: TOTP two-factor authentication was turned off for the account.
    fields:
      - name: accountId
        type: string
        required: true
        tag: account
        description: Identifier of the account that disabled two-factor authentication.
      - name: status
        type: totpStatus
        required: true
        description: Status of the second factor after disabling.
      - name: reason
        type: string
        description: Why two-factor authentication was turned off.
      - name: disabledAt
        type: string
        required: true
        description: Moment two-factor authentication was switched off.
  - name: recoveryCodesGenerated
    description: A new recovery code set is issued and every previously issued code becomes invalid
    fields:
      - name: accountId
        type: string
        required: true
        tag: account
        description: Identifier of the account the recovery codes were issued for.
      - name: recoveryCodeHashes
        type: string
        array: true
        required: true
        description: Number of recovery codes in the new set.
      - name: generatedAt
        type: string
        required: true
        description: Hash of every issued recovery code; plaintext codes are never stored.
      - name: ""
        type: ""
        description: Timestamp when the recovery code set was generated.
  - name: recoveryCodeUsed
    description: A recovery code was redeemed, completing the second factor for a pending login session.
    fields:
      - name: accountId
        type: string
        required: true
        tag: account
        description: Account whose recovery code was redeemed
      - name: remainingCodes
        type: integer
        required: true
        description: Number of unused recovery codes left after redemption
      - name: usedAt
        type: string
        required: true
        description: Timestamp of the redemption
  - name: recoveryCodeVerificationFailed
    description: A recovery code attempt was rejected, e.g. unknown code, already used code or too many failures.
    fields:
      - name: accountId
        type: string
        required: true
        tag: account
        description: Account the failed recovery code attempt belongs to
      - name: failedAttempts
        type: integer
        required: true
        description: Consecutive failed recovery code attempts after this failure
      - name: failedAt
        type: string
        required: true
        description: Timestamp when the recovery code attempt was rejected
  - name: passkeyVerified
    description: A passkey assertion was accepted, completing the second factor for a pending login session.
    fields:
      - name: accountId
        type: string
        required: true
        tag: account
        description: Account whose passkey assertion was verified
      - name: credentialId
        type: passkeyCredentialId
        required: true
        tag: passkey
        description: Identifier of the passkey credential that was verified
      - name: signCount
        type: integer
        required: true
        description: Signature counter reported by the authenticator
      - name: verifiedAt
        type: string
        required: true
        description: Timestamp of the successful verification
  - name: passkeyVerificationFailed
    description: A passkey second-factor assertion was rejected.
    fields:
      - name: accountId
        type: string
        required: true
        tag: account
        description: Account whose second-factor attempt failed.
      - name: credentialId
        type: passkeyCredentialId
        required: true
        tag: passkey
        description: Passkey credential that was presented.
      - name: failedAttempts
        type: integer
        required: true
        description: Consecutive failed second-factor attempts for this credential.
      - name: reason
        type: string
        description: Why the assertion was rejected.
      - name: failedAt
        type: string
        required: true
        description: When the failed attempt happened.
  - name: passkeyLoginSucceeded
    description: An account signed in directly with a passkey, without a password.
    fields:
      - name: accountId
        type: string
        required: true
        tag: account
        description: Account that was signed in.
      - name: credentialId
        type: passkeyCredentialId
        required: true
        tag: passkey
        description: Passkey credential used for the sign-in.
      - name: signCount
        type: integer
        required: true
        description: Signature counter returned by the authenticator.
      - name: loginAt
        type: string
        required: true
        description: When the passwordless sign-in happened.
  - name: passkeyLoginFailed
    description: A passwordless sign-in attempt with a passkey was rejected.
    fields:
      - name: credentialId
        type: passkeyCredentialId
        required: true
        tag: passkey
        description: Passkey credential that was presented.
      - name: reason
        type: string
        required: true
        description: Why the sign-in attempt was rejected.
      - name: failedAt
        type: string
        required: true
        description: When the failed sign-in attempt happened.
  - name: secondFactorPasskeyRegistered
    description: A passkey credential was registered exclusively as a second factor for the account.
    fields:
      - name: accountId
        type: string
        required: true
        tag: account
        description: Account that owns the newly registered credential
      - name: credentialId
        type: passkeyCredentialId
        required: true
        tag: passkey
        description: WebAuthn credential identifier created by the authenticator
      - name: publicKey
        type: passkeyPublicKey
        required: true
        description: Public key used to verify later assertions of this credential
      - name: signCount
        type: integer
        required: true
        description: Authenticator signature counter value at registration time
      - name: purpose
        type: passkeyPurpose
        required: true
        description: Purpose of the credential, always secondFactor for this event
      - name: status
        type: passkeyStatus
        required: true
        description: Credential status immediately after registration
      - name: deviceName
        type: string
        description: Human readable label of the authenticator device
      - name: registeredAt
        type: string
        required: true
        description: Timestamp of the successful second-factor registration
  - name: loginPasskeyRegistered
    description: A passkey credential was registered as a primary passwordless login method for the account.
    fields:
      - name: accountId
        type: string
        required: true
        tag: account
        description: Account that owns the newly registered credential
      - name: credentialId
        type: passkeyCredentialId
        required: true
        tag: passkey
        description: WebAuthn credential identifier created by the authenticator
      - name: publicKey
        type: passkeyPublicKey
        required: true
        description: Public key used to verify later assertions of this credential
      - name: signCount
        type: integer
        required: true
        description: Authenticator signature counter value at registration time
      - name: purpose
        type: passkeyPurpose
        required: true
        description: Purpose of the credential, always primaryLogin for this event
      - name: status
        type: passkeyStatus
        required: true
        description: Credential status immediately after registration
      - name: deviceName
        type: string
        description: Human readable label of the authenticator device
      - name: registeredAt
        type: string
        required: true
        description: Timestamp of the successful login-passkey registration
  - name: passkeyDeleted
    description: A passkey credential was permanently removed from an account.
    fields:
      - name: accountId
        type: string
        required: true
        tag: account
        description: Account the passkey belonged to
      - name: credentialId
        type: passkeyCredentialId
        required: true
        tag: passkey
        description: Identifier of the deleted passkey credential
      - name: purpose
        type: passkeyPurpose
        required: true
        description: Whether the deleted passkey was used as a second factor or for passwordless sign-in
      - name: deletedAt
        type: string
        required: true
        description: Timestamp at which the passkey was deleted
  - name: passwordChanged
    description: Records that the owner replaced the account password; carries the new credential hash so the password state can be rebuilt.
    fields:
      - name: accountId
        type: string
        required: true
        tag: account
        description: Account whose password was changed
      - name: passwordHash
        type: string
        required: true
        description: Hash of the newly chosen password
      - name: changedAt
        type: string
        required: true
        description: Timestamp when the password was changed
  - name: passwordResetRequested
    description: A single-use, time-limited password reset link was issued for the account
    fields:
      - name: accountId
        type: string
        required: true
        tag: account
        description: Identifier of the account that requested the reset
      - name: resetToken
        type: string
        required: true
        tag: passwordReset
        description: Opaque token embedded in the emailed reset link
      - name: requestedAt
        type: string
        required: true
        description: Timestamp the reset was requested, ISO-8601
      - name: expiresAt
        type: string
        required: true
        description: Timestamp after which the reset token can no longer be used, ISO-8601
  - name: passwordResetCompleted
    description: Records that the account password was set through a reset link; carries the new credential hash and consumes the reset token.
    fields:
      - name: accountId
        type: string
        required: true
        tag: account
        description: Account whose password was reset
      - name: resetToken
        type: string
        required: true
        tag: passwordReset
        description: Reset token that was redeemed
      - name: passwordHash
        type: string
        required: true
        description: Hash of the newly chosen password
      - name: completedAt
        type: string
        required: true
        description: Timestamp when the reset was completed
  - name: passwordVerified
    description: Emitted when a submitted password matches the account's stored credential.
    fields:
      - name: accountId
        type: string
        required: true
        tag: account
        description: Account whose password was verified
      - name: verifiedAt
        type: string
        required: true
        description: Timestamp of the successful verification
  - name: passwordVerificationFailed
    description: Emitted when a submitted password does not match the account's stored credential.
    fields:
      - name: accountId
        type: string
        required: true
        tag: account
        description: Account whose password verification failed
      - name: reason
        type: string
        required: true
        description: Why the password verification was refused
      - name: failedAttempts
        type: integer
        required: true
        description: Consecutive failed attempts after this failure
      - name: failedAt
        type: string
        required: true
        description: Timestamp of the failed verification
  - name: sessionCreated
    description: Emitted when a new authenticated session is issued for an account.
    fields:
      - name: sessionId
        type: sessionId
        required: true
        tag: session
        description: Identifier of the issued session
      - name: accountId
        type: string
        required: true
        tag: account
        description: Account the session belongs to
      - name: method
        type: loginMethod
        required: true
        description: Authentication method that produced the session
      - name: status
        type: sessionStatus
        required: true
        description: Status of the session right after creation
      - name: issuedAt
        type: string
        required: true
        description: Timestamp when the session was issued
      - name: expiresAt
        type: string
        required: true
        description: Timestamp when the session expires
  - name: sessionRevoked
    description: A session has been revoked by an administrator and can no longer be used
    fields:
      - name: sessionId
        type: sessionId
        required: true
        tag: session
        description: Identifier of the revoked session
      - name: accountId
        type: string
        required: true
        tag: account
        description: Account that owned the revoked session
      - name: reason
        type: string
        description: Reason given by the administrator for the revocation
      - name: revokedAt
        type: string
        description: Timestamp at which the session was revoked
  - name: passwordInitialized
    description: The initial password credential was created for an account.
    fields:
      - name: accountId
        type: string
        required: true
        tag: account
        description: Identifier of the account the password belongs to
      - name: passwordHash
        type: string
        required: true
        description: Hashed value of the initial password
      - name: initializedAt
        type: datetime
        required: true
        description: Moment the initial password was stored
commands:
  - name: registerAccount
    action: account:registerAccount
    description: Registers a new account using the email address as its identity and a password as its credential.
    inputs:
      - name: email
        type: email
        required: true
        description: The email address that identifies the new account; used as the login identity.
      - name: password
        type: password
        required: true
        description: The plain-text password chosen by the user; it is hashed before the event is emitted.
    responses:
      - name: accountId
        type: string
        required: true
        description: Identifier of the newly created account.
      - name: email
        type: email
        required: true
        description: The email identity the account was registered with.
      - name: status
        type: accountStatus
        required: true
        description: Initial lifecycle status of the new account.
  - name: sendActivationEmail
    action: account:sendActivationEmail
    description: Sends the activation link email to a newly registered account. The command only receives the account identifier; the email address is read from the account's pending activation state.
    inputs:
      - name: accountId
        type: string
        required: true
        description: Identifier of the account that must receive the activation email; the recipient address is resolved from the account state.
    responses:
      - name: activationToken
        type: string
        required: true
        description: One-time token embedded in the activation link sent to the account owner.
      - name: expiresAt
        type: string
        required: true
        description: Moment at which the activation link stops being valid.
  - name: activateAccount
    action: account:activateAccount
    description: Redeems the one-time activation token from the email link and turns the pending account into an activated one.
    inputs:
      - name: activationToken
        type: string
        required: true
        description: One-time token taken from the activation link in the email.
        validation:
          minLength: 16
          maxLength: 128
    responses:
      - name: accountId
        type: string
        required: true
        description: Identifier of the account that has been activated.
      - name: status
        type: accountStatus
        required: true
        description: New status of the account, always activated after a successful activation.
      - name: activatedAt
        type: string
        required: true
        description: Moment the account was activated.
  - name: suspendAccount
    action: account:suspendAccount
    description: Administrator suspends an account, temporarily blocking its use
    inputs:
      - name: accountId
        type: string
        required: true
        description: Identifier of the account to suspend
      - name: reason
        type: string
        required: true
        description: Reason for the suspension, kept for audit
        validation:
          minLength: 3
          maxLength: 500
    responses:
      - name: accountId
        type: string
        required: true
        description: Identifier of the suspended account
      - name: status
        type: accountStatus
        required: true
        description: Status of the account after the change
      - name: suspendedAt
        type: string
        required: true
        description: Timestamp when the account was suspended
  - name: unsuspendAccount
    action: account:unsuspendAccount
    description: Administrator lifts a suspension so the account becomes usable again
    inputs:
      - name: accountId
        type: string
        required: true
        description: Identifier of the account to restore
      - name: reason
        type: string
        required: true
        description: Reason for lifting the suspension, kept for audit
        validation:
          minLength: 3
          maxLength: 500
    responses:
      - name: accountId
        type: string
        required: true
        description: Identifier of the restored account
      - name: status
        type: accountStatus
        required: true
        description: Status of the account after the change
      - name: unsuspendedAt
        type: string
        required: true
        description: Timestamp when the suspension was lifted
  - name: deleteAccount
    action: account:deleteAccount
    description: Administrator permanently deletes an account
    inputs:
      - name: accountId
        type: string
        required: true
        description: Identifier of the account to delete
      - name: reason
        type: string
        required: true
        description: Reason for deleting the account, kept for audit
        validation:
          minLength: 3
          maxLength: 500
    responses:
      - name: accountId
        type: string
        required: true
        description: Identifier of the deleted account
      - name: status
        type: accountStatus
        required: true
        description: Status of the account after the change
      - name: deletedAt
        type: string
        required: true
        description: Timestamp when the account was deleted
  - name: enrollTotp
    action: totp:enrollTotp
    description: "Starts two-factor enrollment: generates a new TOTP secret for the account and returns the provisioning URI to scan. No recovery codes yet - those are issued only after the first code is confirmed."
    inputs:
      - name: accountId
        type: string
        required: true
        description: Identifier of the account that starts TOTP enrollment.
    responses:
      - name: accountId
        type: string
        required: true
        description: Identifier of the account the secret was created for.
      - name: secret
        type: totpSecret
        required: true
        description: Newly generated shared TOTP secret the authenticator app must store.
      - name: provisioningUri
        type: string
        required: true
        description: otpauth:// URI rendered as a QR code for the authenticator app.
      - name: period
        type: integer
        required: true
        description: Length in seconds of one time step used to derive codes.
      - name: digits
        type: integer
        required: true
        description: Number of digits in each generated one-time code.
  - name: confirmTotpEnrollment
    action: totp:confirmTotpEnrollment
    description: Confirms a pending authenticator enrollment with a one-time code, enabling two-factor authentication and issuing the first set of recovery codes.
    inputs:
      - name: accountId
        type: string
        required: true
        description: Identifier of the account confirming the enrollment.
      - name: code
        type: totpCode
        required: true
        description: One-time code generated by the authenticator app, proving possession of the secret.
    responses:
      - name: accountId
        type: string
        required: true
        description: Identifier of the account whose second factor is now enabled.
      - name: status
        type: totpStatus
        required: true
        description: New status of the account's two-factor enrollment.
      - name: enabledAt
        type: string
        required: true
        description: Timestamp when two-factor authentication became enabled.
      - name: recoveryCodes
        type: recoveryCode
        array: true
        required: true
        description: Plain-text recovery codes shown once to the account owner after enrollment.
      - name: codesIssuedAt
        type: string
        required: true
        description: Timestamp when this set of recovery codes was issued.
  - name: verifyTotpCode
    action: totp:verifyTotpCode
    description: Verifies a TOTP code as the second factor and releases the pending login session.
    inputs:
      - name: accountId
        type: string
        required: true
        description: Account whose second factor is verified
      - name: code
        type: totpCode
        required: true
        description: Six-digit code produced by the authenticator app
    responses:
      - name: verified
        type: boolean
        required: true
        description: Whether the submitted code matched the account secret
      - name: failedAttempts
        type: integer
        required: true
        description: Number of consecutive failed code submissions after this attempt
  - name: disableTotp
    action: totp:disableTotp
    description: Turns TOTP two-factor authentication off after a valid current code.
    inputs:
      - name: accountId
        type: string
        required: true
        description: Identifier of the account disabling two-factor authentication.
      - name: code
        type: totpCode
        required: true
        description: Current one-time code proving possession of the authenticator.
      - name: reason
        type: string
        description: Optional reason for turning two-factor authentication off.
        validation:
          maxLength: 500
    responses:
      - name: accountId
        type: string
        required: true
        description: Identifier of the account whose second factor was turned off.
      - name: status
        type: totpStatus
        required: true
        description: Status of the second factor after disabling.
      - name: disabledAt
        type: string
        required: true
        description: Moment two-factor authentication was switched off.
  - name: regenerateRecoveryCodes
    action: recoveryCodes:regenerateRecoveryCodes
    description: Replaces the recovery code set of a two-factor enabled account, invalidating all previously issued codes.
    inputs:
      - name: accountId
        type: string
        required: true
        description: Identifier of the account requesting a new recovery code set.
      - name: code
        type: totpCode
        required: true
        description: Current one-time code proving the requester still controls the authenticator.
    responses:
      - name: accountId
        type: string
        required: true
        description: Identifier of the account that received new recovery codes.
      - name: recoveryCodes
        type: recoveryCode
        array: true
        required: true
        description: Newly generated plain-text recovery codes, shown only once.
      - name: generatedAt
        type: string
        required: true
        description: Timestamp when the new recovery code set was generated.
  - name: verifyRecoveryCode
    action: recoveryCodes:verifyRecoveryCode
    description: Redeems a recovery code as the second factor and releases the pending login session.
    inputs:
      - name: accountId
        type: string
        required: true
        description: Account whose recovery code is being redeemed
      - name: recoveryCode
        type: recoveryCode
        required: true
        description: Recovery code submitted by the user
    responses:
      - name: verified
        type: boolean
        required: true
        description: Whether the submitted recovery code was valid
      - name: remainingCodes
        type: integer
        required: true
        description: Number of unused recovery codes left after redemption
      - name: failedAttempts
        type: integer
        required: true
        description: Number of consecutive failed redemption attempts
  - name: verifyPasskeySecondFactor
    action: passkey:verifyPasskeySecondFactor
    description: Verifies a passkey assertion as the second factor and releases the pending login session.
    inputs:
      - name: accountId
        type: string
        required: true
        description: Account whose passkey assertion is being checked
      - name: credentialId
        type: passkeyCredentialId
        required: true
        description: Identifier of the passkey credential used for the assertion
      - name: challenge
        type: json
        required: true
        description: Challenge issued for this verification attempt
      - name: clientDataJson
        type: json
        required: true
        description: Client data produced by the authenticator
      - name: authenticatorData
        type: string
        required: true
        description: Raw authenticator data of the assertion
      - name: signature
        type: string
        required: true
        description: Signature produced by the authenticator
    responses:
      - name: verified
        type: boolean
        required: true
        description: Whether the assertion was valid
      - name: failedAttempts
        type: integer
        required: true
        description: Number of consecutive failed assertions after this attempt
      - name: status
        type: passkeyStatus
        required: true
        description: Status of the passkey after the attempt
  - name: loginWithPasskey
    action: passkey:loginWithPasskey
    description: Authenticates a user directly with a passwordless passkey, using request options generated from a passkey policy.
    inputs:
      - name: credentialId
        type: passkeyCredentialId
        required: true
        description: Credential identifier chosen by the authenticator for this login.
      - name: challenge
        type: passkeyChallenge
        required: true
        description: Challenge taken from the request options generated for this ceremony.
      - name: policy
        type: passkeyPolicy
        required: true
        description: Passkey policy used to generate the request options and to verify the assertion.
      - name: clientDataJson
        type: json
        required: true
        description: Base64url encoded clientDataJSON returned by the browser.
      - name: authenticatorData
        type: string
        required: true
        description: Base64url encoded authenticator data returned by the authenticator.
      - name: signature
        type: string
        required: true
        description: Base64url encoded signature the authenticator produced over the challenge.
    responses:
      - name: accountId
        type: string
        required: true
        description: Account resolved from the credential when the assertion succeeds.
      - name: authenticated
        type: boolean
        required: true
        description: Whether the passkey assertion was accepted.
      - name: failedAttempts
        type: integer
        required: true
        description: Number of consecutive failed attempts recorded for the account.
      - name: loginAt
        type: string
        required: true
        description: Moment the login was accepted.
  - name: registerSecondFactorPasskey
    action: passkey:registerSecondFactorPasskey
    description: Registers a new passkey used only as a second factor, using options generated from a passkey policy.
    inputs:
      - name: accountId
        type: string
        required: true
        description: Account that owns the new passkey.
      - name: credentialId
        type: passkeyCredentialId
        required: true
        description: Credential identifier produced by the authenticator.
      - name: challenge
        type: passkeyChallenge
        required: true
        description: Challenge taken from the creation options generated for this ceremony.
      - name: policy
        type: passkeyPolicy
        required: true
        description: Passkey policy used to generate the creation options and to verify the response.
      - name: clientDataJson
        type: json
        required: true
        description: Base64url encoded clientDataJSON returned by the browser.
      - name: attestationObject
        type: string
        required: true
        description: Base64url encoded attestation object returned by the authenticator.
      - name: deviceName
        type: string
        required: true
        description: Label the user gives the authenticator device for later recognition.
        validation:
          minLength: 1
          maxLength: 64
    responses:
      - name: accountId
        type: string
        required: true
        description: Account that now owns the credential.
      - name: credentialId
        type: passkeyCredentialId
        required: true
        description: Registered credential identifier.
      - name: status
        type: passkeyStatus
        required: true
        description: Status of the new credential after registration.
      - name: registeredAt
        type: string
        required: true
        description: Moment the credential was registered.
  - name: registerLoginPasskey
    action: passkey:registerLoginPasskey
    description: Registers a new passwordless passkey used for direct login, using options generated from a passkey policy.
    inputs:
      - name: accountId
        type: string
        required: true
        description: Account that owns the new passkey.
      - name: credentialId
        type: passkeyCredentialId
        required: true
        description: Credential identifier produced by the authenticator.
      - name: challenge
        type: passkeyChallenge
        required: true
        description: Challenge taken from the creation options generated for this ceremony.
      - name: policy
        type: passkeyPolicy
        required: true
        description: Passkey policy used to generate the creation options and to verify the response.
      - name: clientDataJson
        type: json
        required: true
        description: Base64url encoded clientDataJSON returned by the browser.
      - name: attestationObject
        type: string
        required: true
        description: Base64url encoded attestation object returned by the authenticator.
      - name: deviceName
        type: string
        required: true
        description: Label the user gives the authenticator device for later recognition.
        validation:
          minLength: 1
          maxLength: 64
    responses:
      - name: accountId
        type: string
        required: true
        description: Account that now owns the credential.
      - name: credentialId
        type: passkeyCredentialId
        required: true
        description: Registered credential identifier.
      - name: status
        type: passkeyStatus
        required: true
        description: Status of the new credential after registration.
      - name: registeredAt
        type: string
        required: true
        description: Moment the credential was registered.
  - name: deletePasskey
    action: passkey:deletePasskey
    description: Permanently removes a registered passkey from an account so it can no longer be used for sign-in or 2FA.
    inputs:
      - name: accountId
        type: string
        required: true
        description: Account that owns the passkey to be deleted
      - name: credentialId
        type: passkeyCredentialId
        required: true
        description: Identifier of the passkey credential to delete
    responses:
      - name: deletedAt
        type: string
        required: true
        description: Timestamp at which the passkey was deleted
  - name: changePassword
    action: password:changePassword
    description: A signed-in account owner replaces their password by proving the current one
    inputs:
      - name: accountId
        type: string
        required: true
        description: Identifier of the account whose password is changed
      - name: currentPassword
        type: password
        required: true
        description: Password the user is currently using, used to prove ownership
      - name: newPassword
        type: password
        required: true
        description: New password the user wants to start using
    responses:
      - name: changedAt
        type: string
        required: true
        description: Timestamp the new password took effect, ISO-8601
  - name: requestPasswordReset
    action: password:requestPasswordReset
    description: A user who forgot the password asks for a reset link to be emailed to them
    inputs:
      - name: email
        type: email
        required: true
        description: Email address the user registered with
    responses:
      - name: requestAccepted
        type: boolean
        required: true
        description: True when the request was accepted; always true for unknown emails to avoid account enumeration
  - name: resetPassword
    action: password:resetPassword
    description: A user sets a new password using the token received by email
    inputs:
      - name: resetToken
        type: string
        required: true
        description: Token taken from the reset link sent by email
      - name: newPassword
        type: password
        required: true
        description: New password the user wants to start using
    responses:
      - name: completed
        type: boolean
        required: true
        description: True when the new password was stored and the token consumed
  - name: createPasskeyCreationOptions
    action: passkey:createPasskeyCreationOptions
    description: Builds WebAuthn creation options for registering a new passkey and parks them in temporary storage until the registration is verified. Deliberately publishes no domain event, since the options are transient.
    inputs:
      - name: accountId
        type: string
        required: true
        description: Account that will own the new passkey
      - name: policy
        type: passkeyPolicy
        required: true
        description: Relying party and ceremony policy applied to the options
      - name: excludeCredentialIds
        type: passkeyCredentialId
        array: true
        description: Already registered credentials that must not be duplicated
      - name: deviceName
        type: string
        description: Label the user gives the authenticator being enrolled
        validation:
          minLength: 1
          maxLength: 64
    responses:
      - name: options
        type: passkeyCreationOptions
        required: true
        description: Creation options handed to the browser
      - name: expiresAt
        type: string
        required: true
        description: Moment the options stop being accepted
      - name: stored
        type: boolean
        required: true
        description: Whether the options were parked in temporary storage
  - name: createPasskeyRequestOptions
    action: passkey:createPasskeyRequestOptions
    description: Builds WebAuthn request options for an authentication ceremony and parks them in temporary storage until the assertion is verified. Deliberately publishes no domain event, since the options are transient.
    inputs:
      - name: policy
        type: passkeyPolicy
        required: true
        description: Relying party and ceremony policy applied to the options
      - name: accountId
        type: string
        description: Account the ceremony is started for, omitted for a usernameless sign-in
      - name: allowCredentialIds
        type: passkeyCredentialId
        array: true
        required: true
        description: Credentials the authenticator may answer with
    responses:
      - name: options
        type: passkeyRequestOptions
        required: true
        description: Request options handed to the browser
      - name: expiresAt
        type: string
        required: true
        description: Moment the options stop being accepted
      - name: stored
        type: boolean
        required: true
        description: Whether the options were parked in temporary storage
  - name: verifyPassword
    action: password:verifyPassword
    description: Checks a submitted password against the account's stored credential without issuing a session.
    inputs:
      - name: accountId
        type: string
        required: true
        description: Account whose password is being checked
      - name: password
        type: password
        required: true
        description: Plain-text password submitted for verification
    responses:
      - name: verified
        type: boolean
        required: true
        description: Whether the submitted password matches the stored credential
      - name: failedAttempts
        type: integer
        required: true
        description: Consecutive failed attempts recorded after this check
  - name: createSession
    action: session:createSession
    description: Creates a new authenticated session for an account whose credentials have already been verified.
    inputs:
      - name: accountId
        type: string
        required: true
        description: Account the session is created for
      - name: method
        type: loginMethod
        required: true
        description: Authentication method that produced the session
    responses:
      - name: sessionId
        type: sessionId
        required: true
        description: Identifier of the newly created session
      - name: status
        type: sessionStatus
        required: true
        description: Status of the newly created session
      - name: issuedAt
        type: string
        required: true
        description: Timestamp when the session was issued
      - name: expiresAt
        type: string
        required: true
        description: Timestamp when the session expires
  - name: revokeSession
    action: session:revokeSession
    description: Command issued by an administrator to revoke an existing session immediately
    inputs:
      - name: sessionId
        type: sessionId
        required: true
        description: Identifier of the session to revoke
      - name: reason
        type: string
        description: Reason why the administrator revokes the session (e.g. suspected compromise, user request)
    responses:
      - name: sessionId
        type: sessionId
        required: true
        description: Identifier of the revoked session
      - name: status
        type: sessionStatus
        required: true
        description: Status of the session after the revocation
queries:
  - name: getTotpStatus
    action: totp:getTotpStatus
    description: Read the two-factor status of one account
    params:
      - name: accountId
        type: string
        required: true
        description: Account whose two-factor status is requested
    responses:
      - name: accountId
        type: string
        required: true
        description: Account the status belongs to
      - name: status
        type: totpStatus
        required: true
        description: Current state of the second factor
      - name: failedAttempts
        type: integer
        required: true
        description: Number of consecutive failed code submissions
      - name: enabledAt
        type: string
        description: Moment the second factor was enabled
  - name: getPasskeys
    action: passkey:getPasskeys
    description: List the passkeys registered on an account with their usage and status.
    params:
      - name: accountId
        type: string
        required: true
        description: Account whose passkeys should be listed.
    responses:
      - name: passkeys
        type: passkeyCredential
        array: true
        required: true
        description: Every passkey registered on the account.
      - name: activeCount
        type: integer
        required: true
        description: How many passkeys are currently usable.
      - name: primaryLoginAvailable
        type: boolean
        required: true
        description: Whether at least one passkey can sign in directly.
states:
  - name: accountRegistry
    description: Looks at previous registrations to tell whether an email address is already taken.
    params:
      - name: email
        type: email
        required: true
        description: Email address the user wants to register.
    query:
      - types:
          - accountRegistered
        description: Every previous account registration, scanned for a matching email address.
    states:
      - name: registeredEmails
        type: email
        array: true
        description: Email addresses already claimed by registered accounts.
      - name: registeredAccountId
        type: string
        description: Identifier of the existing account already using the requested email, if any.
  - name: pendingActivation
    description: "Decision model used before sending an activation email: it tells whether the account is still pending."
    params:
      - name: accountId
        type: string
        required: true
        description: Account the activation email is about.
    query:
      - types:
          - accountRegistered
          - accountActivated
        tags:
          - tag: account
            field: accountId
        description: Registration and activation history of the account.
    states:
      - name: email
        type: email
        description: Email identity of the account.
      - name: status
        type: accountStatus
        description: Current status of the account, pending until the activation link is used.
  - name: accountActivation
    description: "Decision state for validating an activation link: loaded directly by the activation token tag."
    params:
      - name: activationToken
        type: string
        required: true
        description: Activation token taken from the link the user followed
    query:
      - types:
          - activationEmailSent
          - accountActivated
        tags:
          - tag: activation
            field: activationToken
        description: Activation email issuance and activation events bound to this exact activation token
    states:
      - name: accountId
        type: string
        description: Account the activation token was issued for
      - name: email
        type: email
        description: Email identity of that account
      - name: expiresAt
        type: string
        description: Expiry moment of the activation link
      - name: status
        type: accountStatus
        description: Current status of the account, used to detect reuse of the link
  - name: accountLifecycle
    description: Decision model giving the current lifecycle status of an account so administrative actions can be gated
    params:
      - name: accountId
        type: string
        required: true
        description: Identifier of the account whose lifecycle is being inspected
    query:
      - types:
          - accountRegistered
          - accountActivated
          - accountSuspended
          - accountUnsuspended
          - accountDeleted
        tags:
          - tag: account
            field: accountId
        description: All lifecycle events of the account, folded into its current status
    states:
      - name: email
        type: email
        description: Email identity currently bound to the account
      - name: status
        type: accountStatus
        required: true
        description: Current lifecycle status of the account
      - name: lastReason
        type: string
        description: Most recent administrative reason recorded for the account
  - name: totpEnrollment
    description: "Decision model of an account's authenticator enrollment: the pending secret, its parameters and the current two-factor status. Recovery codes are counted only after the first code is confirmed, since they are issued at that moment."
    params:
      - name: accountId
        type: string
        required: true
        description: Account whose authenticator enrollment is read
    query:
      - types:
          - totpEnrollmentRequested
          - totpEnabled
          - totpDisabled
        tags:
          - tag: account
            field: accountId
        description: Enrollment lifecycle of the account's authenticator
    states:
      - name: secret
        type: totpSecret
        description: Shared secret generated for the enrolled authenticator
      - name: provisioningUri
        type: string
        description: otpauth URI the authenticator app scans
      - name: status
        type: totpStatus
        required: true
        description: Current state of the second factor
      - name: period
        type: integer
        description: Length of one time-step in seconds
      - name: digits
        type: integer
        description: Number of digits in a generated code
      - name: enabledAt
        type: string
        description: Moment the second factor was confirmed and enabled
  - name: totpVerification
    description: Decision model of verification attempts, used to detect lockout after repeated failures.
    params:
      - name: accountId
        type: string
        required: true
        description: Account whose second-factor attempts are read
    query:
      - types:
          - totpEnabled
          - totpDisabled
          - totpCodeVerified
          - totpVerificationFailed
        tags:
          - tag: account
            field: accountId
        description: Second-factor state and attempt history of the account
    states:
      - name: status
        type: totpStatus
        required: true
        description: Current state of the second factor
      - name: failedAttempts
        type: integer
        description: Number of consecutive failed code submissions
      - name: lastVerifiedAt
        type: string
        description: Moment a code was last verified successfully
  - name: totpLifecycle
    description: Two-factor status of a single account, used by the account's own security screen
    params:
      - name: accountId
        type: string
        required: true
        description: Account whose two-factor status is read
    query:
      - types:
          - totpEnrollmentRequested
          - totpEnabled
          - totpDisabled
          - totpCodeVerified
          - totpVerificationFailed
        tags:
          - tag: account
            field: accountId
        description: Full second-factor history of the account
    states:
      - name: status
        type: totpStatus
        required: true
        description: Current state of the second factor
      - name: enabledAt
        type: string
        description: Moment the second factor was enabled
      - name: disabledAt
        type: string
        description: Moment the second factor was turned off
      - name: failedAttempts
        type: integer
        description: Number of consecutive failed code submissions
      - name: lastVerifiedAt
        type: string
        description: Moment a code was last verified successfully
  - name: recoveryCodeInventory
    description: Tracks the current recovery code set of an account, how many codes are still unused and the consecutive failure streak, so a submitted code can be validated.
    params:
      - name: accountId
        type: string
        required: true
        description: Account whose recovery code set is inspected
    query:
      - types:
          - recoveryCodesGenerated
          - recoveryCodeUsed
          - recoveryCodeVerificationFailed
        tags:
          - tag: account
            field: accountId
        description: Every recovery code set issued for the account and each redemption or failed attempt against it
    states:
      - name: unusedCodeHashes
        type: string
        array: true
        description: Hashes of the recovery codes that have not been redeemed yet
      - name: activeCodeCount
        type: integer
        description: Number of recovery codes still available to the account
      - name: failedAttempts
        type: integer
        description: Consecutive failed recovery code attempts since the last success
      - name: generatedAt
        type: string
        description: Timestamp when the current recovery code set was issued
      - name: lastUsedAt
        type: string
        description: Timestamp when a recovery code was last successfully redeemed
  - name: passkeyEnrollment
    description: "Decision model of an account's registered passkeys: which credentials exist, their purpose, status and usage, used to validate new registrations and disabling."
    params:
      - name: accountId
        type: string
        required: true
        description: Account whose registered passkeys are projected
    query:
      - types:
          - secondFactorPasskeyRegistered
          - loginPasskeyRegistered
          - passkeyDeleted
        tags:
          - tag: account
            field: accountId
        description: Passkey registrations and deletions of the account
    states:
      - name: credentialIds
        type: passkeyCredentialId
        array: true
        description: Identifiers of the passkeys currently registered to the account
      - name: activeCount
        type: integer
        description: Number of passkeys currently usable on the account
      - name: status
        type: passkeyStatus
        description: Status of the passkey being registered or deleted
      - name: purpose
        type: passkeyPurpose
        description: Whether the passkey serves as a second factor or as a passwordless login method
      - name: deviceName
        type: string
        description: Human readable name of the device holding the passkey
      - name: registeredAt
        type: string
        description: Timestamp at which the passkey was registered
      - name: lastUsedAt
        type: string
        description: Timestamp of the last successful assertion with the passkey
  - name: passkeyAuthentication
    description: "Decision model of a single passkey credential: its owner, purpose, status and attempt counters, used to gate second-factor verification and direct passwordless login."
    params:
      - name: credentialId
        type: passkeyCredentialId
        required: true
        description: Identifier of the passkey credential used in this authentication attempt
    query:
      - types:
          - secondFactorPasskeyRegistered
          - loginPasskeyRegistered
          - passkeyDeleted
          - passkeyVerified
          - passkeyVerificationFailed
          - passkeyLoginSucceeded
          - passkeyLoginFailed
        tags:
          - tag: passkey
            field: credentialId
        description: Lifecycle and authentication history of the presented passkey
    states:
      - name: accountId
        type: string
        description: Account that owns the passkey
      - name: status
        type: passkeyStatus
        description: "Current status of the passkey: active, disabled or revoked"
      - name: purpose
        type: passkeyPurpose
        description: Whether the passkey is used as a second factor or for passwordless sign-in
      - name: signCount
        type: integer
        description: Authenticator signature counter of the last accepted assertion
      - name: failedAttempts
        type: integer
        description: Consecutive failed assertion attempts for the passkey
      - name: lastUsedAt
        type: string
        description: Timestamp of the last successful authentication with the passkey
  - name: passkeyList
    description: Account-facing list of registered passkeys, rebuilt in memory from the passkey event stream.
    params:
      - name: accountId
        type: string
        required: true
        description: Account whose passkeys are listed
    query:
      - types:
          - secondFactorPasskeyRegistered
          - loginPasskeyRegistered
          - passkeyDeleted
        tags:
          - tag: account
            field: accountId
        description: Passkey registrations and deletions of the account
    states:
      - name: passkeys
        type: passkeyCredential
        array: true
        description: Passkeys currently registered to the account
      - name: activeCount
        type: integer
        description: Number of passkeys currently usable on the account
      - name: primaryLoginAvailable
        type: boolean
        description: Whether the account still has a passkey usable for passwordless sign-in
      - name: lastUsedAt
        type: string
        description: Timestamp of the most recent passkey usage on the account
  - name: secondFactorEnrollment
    description: Account-level view of which second factors are active and how many recovery codes are left. Shared by the TOTP and passkey domains to decide whether recovery codes must be issued.
    params:
      - name: accountId
        type: string
        required: true
        description: Email address of the account whose second-factor state is projected.
    query:
      - types:
          - totpEnabled
          - totpDisabled
          - recoveryCodesGenerated
          - recoveryCodeUsed
          - secondFactorPasskeyRegistered
          - passkeyDeleted
        tags:
          - tag: account
            field: accountId
        description: All second-factor enable/disable and recovery-code events for this account.
    states:
      - name: secondFactorActive
        type: boolean
        description: True when any second factor (TOTP or a 2FA passkey) is active on the account.
      - name: totpActive
        type: boolean
        description: True when TOTP is the active second factor.
      - name: activePasskeyCount
        type: integer
        description: Number of 2FA-purpose passkeys currently registered.
      - name: recoveryCodesRemaining
        type: integer
        description: Number of unused recovery codes left for the account.
      - name: recoveryCodesIssuedByFactor
        type: recoveryCodeIssueState
        array: true
        description: Per factor type, whether a recovery code set was already issued.
  - name: passwordCredential
    description: Current password credential of an account, built from the initial credential event and every later change or reset.
    params:
      - name: accountId
        type: string
        required: true
        description: Account whose credential is being read
    query:
      - types:
          - passwordInitialized
          - passwordChanged
          - passwordResetCompleted
        tags:
          - tag: account
            field: accountId
        description: Every event that sets or replaces the account credential
    states:
      - name: passwordHash
        type: string
        required: true
        description: Hash of the currently valid password
      - name: credentialSetAt
        type: string
        description: Timestamp when the first credential was stored
      - name: lastChangedAt
        type: string
        description: Timestamp of the most recent password change or reset
  - name: passwordResetRequest
    description: State of a password reset request, used to decide whether a reset link may still be redeemed and to identify the account it belongs to.
    params:
      - name: resetToken
        type: string
        required: true
        description: Reset token presented by the user
      - name: accountId
        type: string
        required: true
        description: Account that owns the reset token, resolved from the token's events
    query:
      - types:
          - passwordResetRequested
          - passwordResetCompleted
        tags:
          - tag: passwordReset
            field: resetToken
        description: Issue and redemption of this reset token
      - types:
          - passwordChanged
        tags:
          - tag: account
            field: accountId
        description: Password changes on the same account, which void any pending reset
    states:
      - name: requestStatus
        type: passwordResetStatus
        required: true
        description: Whether the request is still pending, already completed or expired
      - name: requestedAt
        type: string
        description: Timestamp when the reset was requested
      - name: expiresAt
        type: string
        description: Timestamp after which the reset link can no longer be used
      - name: lastPasswordChangedAt
        type: string
        description: Timestamp of the last password change on the account, used to void older reset links
  - name: passwordVerification
    description: Password verification history of an account, tracking consecutive failures and the resulting lock-out before a password may be checked again.
    params:
      - name: accountId
        type: string
        required: true
        description: Account whose verification history is being read
    query:
      - types:
          - passwordVerified
          - passwordVerificationFailed
        tags:
          - tag: account
            field: accountId
        description: Successful and failed password checks of the account; a success clears the failure counter
    states:
      - name: failedAttempts
        type: integer
        description: Number of failed password checks since the last successful one
      - name: isLocked
        type: boolean
        description: True when the consecutive failure threshold has been reached and checks are refused
      - name: lastVerifiedAt
        type: string
        description: Timestamp of the last successful password check
      - name: lastFailedAt
        type: string
        description: Timestamp of the last failed password check
  - name: sessionRecord
    description: Decision model of an issued session, used to gate later actions performed with that session.
    params:
      - name: sessionId
        type: sessionId
        required: true
        description: Identifier of the session whose current state is loaded
    query:
      - types:
          - sessionCreated
          - sessionRevoked
        tags:
          - tag: session
            field: sessionId
        description: All lifecycle events of the session identified by sessionId
    states:
      - name: accountId
        type: string
        description: Account that owns the session
      - name: method
        type: loginMethod
        description: Authentication method that created the session
      - name: status
        type: sessionStatus
        required: true
        description: Current status of the session (active, revoked or expired)
      - name: issuedAt
        type: string
        description: Timestamp at which the session was created
      - name: expiresAt
        type: string
        description: Timestamp at which the session expires
      - name: revokedAt
        type: string
        description: Timestamp at which the session was revoked, if it was revoked
      - name: revokeReason
        type: string
        description: Reason recorded for the revocation, if the session was revoked
constraints:
  - name: emailMustBeUnique
    description: Guards registration so one email identity can never be claimed twice.
    states:
      - accountRegistry
    rules:
      - An email address can be bound to only one account.
      - Registration is refused when the email already belongs to an existing account.
      - An account email must not be re-used while the account still exists in the system.
  - name: accountMustAwaitActivation
    description: Guards that the activation email is only issued for an account still waiting for activation.
    states:
      - pendingActivation
    rules:
      - An activation email can only be sent for an account that is still pending.
      - An account that is already activated must not receive another activation email.
  - name: activationLinkMustBeValid
    description: Guards that only a valid, unused and unexpired activation link can activate the account.
    states:
      - accountActivation
    rules:
      - The activation link must not have expired.
      - An activation link can be used only once.
      - Only an account that is still pending can be activated.
  - name: accountMustBeActiveToSuspend
    description: Invariants gating a suspension request for an account
    states:
      - accountLifecycle
    rules:
      - Only an activated account can be suspended.
      - An account that is already suspended must not be suspended again.
      - A deleted account can never be suspended.
  - name: accountMustBeSuspendedToUnsuspend
    description: Invariants gating a request to lift a suspension
    states:
      - accountLifecycle
    rules:
      - Only a suspended account can be unsuspended.
      - A deleted account can never be restored to active use.
  - name: accountMustNotBeDeleted
    description: Invariants gating a permanent account deletion
    states:
      - accountLifecycle
    rules:
      - An account can only be deleted once it has been activated.
      - An account that is already deleted must not be deleted again.
  - name: totpMustNotBeEnabled
    description: Guards who may start a TOTP enrollment and which account states allow it.
    states:
      - totpEnrollment
      - accountLifecycle
    rules:
      - An account can have only one authenticator enrolled at a time.
      - Two-factor enrollment can only start on an activated account.
      - Enrollment is refused while the account is suspended or deleted.
      - Starting a new enrollment invalidates every recovery code issued before it.
  - name: totpEnrollmentMustBePending
    description: Guards confirming a pending TOTP enrollment.
    states:
      - totpEnrollment
    rules:
      - Enrollment must be pending before it can be confirmed.
      - The submitted one-time code must match the code derived from the enrolled secret.
      - A second factor that is already enabled or disabled cannot be confirmed again.
  - name: totpVerificationMustBeAllowed
    description: Invariants that must hold before a TOTP code may be accepted as the second factor of a pending session.
    states:
      - totpEnrollment
      - totpVerification
    rules:
      - Two-factor authentication must be enabled for the account.
      - A code submission is refused once too many codes have failed in a row.
      - The submitted code must match the code derived from the account secret.
      - A code may be used only once.
  - name: totpMustBeEnabledToDisable
    description: Guards turning TOTP two-factor authentication off.
    states:
      - totpEnrollment
    rules:
      - Two-factor authentication must be enabled before it can be turned off.
      - Turning two-factor authentication off requires a valid current one-time code.
  - name: recoveryCodesRequireEnabledTotp
    description: Guards issuing a new recovery code set.
    states:
      - totpEnrollment
    rules:
      - Recovery codes can only be issued while two-factor authentication is enabled.
      - Issuing a new recovery code set makes every previously issued code invalid.
  - name: recoveryCodeMustBeVerifiable
    description: Invariants that must hold before a recovery code may be redeemed as the second factor of a pending session.
    states:
      - recoveryCodeInventory
      - totpEnrollment
    rules:
      - Two-factor authentication must be enabled before a recovery code can be used.
      - A recovery code can be used only once.
      - Only a code from the account's current recovery code set can be verified.
      - Redemption is refused once too many recovery codes have failed in a row.
  - name: secondFactorPasskeyRegistrationMustBeAllowed
    description: Guards registration of a passkey as a second factor and requires recovery codes to exist as soon as a second factor becomes active.
    states:
      - passkeyEnrollment
      - accountLifecycle
      - secondFactorEnrollment
    rules:
      - A second-factor passkey can be registered only for an activated account.
      - A credential can be registered on an account only once.
      - A deleted passkey can never be registered again.
      - A credential registered for passwordless sign-in cannot be re-registered as a second factor.
      - Whenever a second factor is active the account must hold a set of unused recovery codes.
  - name: passkeySecondFactorMustBeAllowed
    description: Invariants that must hold before a passkey assertion may be accepted as the second factor of a pending session.
    states:
      - passkeyAuthentication
    rules:
      - The passkey must be active to serve as a second factor.
      - The assertion must be signed by the registered passkey and match the challenge issued for this attempt.
      - Second-factor verification is refused once too many assertions have failed in a row.
  - name: passkeyLoginMustBeAllowed
    description: Guards direct passwordless sign-in with a passkey.
    states:
      - passkeyAuthentication
    rules:
      - A passkey can sign an account in directly only when it is allowed as a primary login method.
      - A deleted passkey can never sign anyone in.
      - The assertion must be signed by the registered passkey and match the challenge issued for this attempt.
      - Passwordless sign-in is refused once too many attempts have failed in a row.
  - name: loginPasskeyRegistrationMustBeAllowed
    description: Invariants that must hold before a passwordless login passkey is registered.
    states:
      - passkeyEnrollment
      - accountLifecycle
    rules:
      - A passwordless login passkey can be registered only for an activated account.
      - A credential can be registered on an account only once.
      - A deleted passkey can never be registered again.
      - A credential enrolled as a second factor never becomes a passwordless login passkey; passwordless access requires a dedicated login passkey.
  - name: deletablePasskeyMustExist
    description: "Guards passkey deletion: only a credential actually registered to the account may be removed."
    states:
      - passkeyEnrollment
    rules:
      - The passkey must be registered to the account requesting the deletion.
      - Only the owner of the account may delete one of its passkeys.
  - name: totpRecoveryCodesOnlyOnFirstFactor
    description: Guards TOTP enrollment so a new recovery-code set is generated only on the account's first second factor.
    states:
      - secondFactorEnrollment
    rules:
      - Recovery codes are issued only when the account has no active second factor yet.
      - An account that already has another second factor keeps its existing recovery codes when TOTP is enabled.
  - name: passwordChangeMustBeAllowed
    description: Invariants that gate replacing an account's password
    states:
      - passwordCredential
    rules:
      - The supplied current password must match the account's stored credential.
      - The new password must be different from the current password.
  - name: passwordResetMustBeValid
    description: Invariants a password reset link must satisfy before a new password may be set.
    states:
      - passwordResetRequest
    rules:
      - The reset request must still be pending.
      - The reset request must not be past its expiry time.
      - A reset link becomes void once the account password changes through another route.
      - A reset link can be redeemed only once.
  - name: passwordVerificationMustBeAllowed
    description: Invariants that must hold before a password is accepted.
    states:
      - passwordCredential
      - accountLifecycle
      - passwordVerification
    rules:
      - Only an activated account can verify its password.
      - A suspended or deleted account must never pass password verification.
      - The submitted password must match the account's stored credential.
      - Verification is refused once too many attempts have failed in a row.
  - name: sessionCreationMustBeAllowed
    description: Invariants that must hold before a session may be issued.
    states:
      - accountLifecycle
    rules:
      - A session can only be created for an account that is activated.
      - A suspended or deleted account must never receive a session.
  - name: sessionRevocationMustBeAllowed
    description: Invariants that gate revoking a session
    states:
      - sessionRecord
    rules:
      - Only a session that is still active can be revoked
      - A session that has already been revoked cannot be revoked again
      - An expired session can no longer be revoked
services:
  - name: sendActivationEmail
    serviceName: accountNotification
    description: Sends the account activation email carrying the activation link to the newly registered user.
    params:
      - name: recipientEmail
        type: email
        required: true
        description: Email address of the account owner
      - name: recipientName
        type: string
        required: true
        description: Display name used to greet the recipient
      - name: activationLink
        type: string
        required: true
        description: Single-use link the recipient clicks to activate the account
      - name: expiresAt
        type: string
        required: true
        description: Moment the activation link stops working
    returns:
      - name: messageId
        type: string
        required: true
        description: Identifier of the sent notification
      - name: deliveryStatus
        type: string
        required: true
        description: Result of the delivery attempt
      - name: sentAt
        type: string
        required: true
        description: Moment the notification was sent
  - name: sendPasswordResetEmail
    serviceName: passwordNotification
    description: Sends the password reset email carrying the one-time reset link.
    params:
      - name: recipientEmail
        type: email
        required: true
        description: Email address of the account owner
      - name: recipientName
        type: string
        required: true
        description: Display name used to greet the recipient
      - name: resetToken
        type: passwordResetToken
        required: true
        description: Single-use token embedded in the reset link
      - name: resetLink
        type: string
        required: true
        description: Link the recipient opens to set a new password
      - name: expiresAt
        type: string
        required: true
        description: Moment the reset link stops working
    returns:
      - name: messageId
        type: string
        required: true
        description: Identifier of the sent notification
      - name: deliveryStatus
        type: string
        required: true
        description: Result of the delivery attempt
      - name: sentAt
        type: string
        required: true
        description: Moment the notification was sent
  - name: sendAccountActivatedEmail
    serviceName: accountNotification
    description: Notifies the user that their account has been activated successfully.
    params:
      - name: recipientEmail
        type: email
        required: true
        description: Email address the confirmation message is sent to.
      - name: recipientName
        type: string
        required: true
        description: Display name of the account owner used in the greeting.
      - name: activatedAt
        type: string
        required: true
        description: Moment the account became active.
    returns:
      - name: messageId
        type: string
        required: true
        description: Identifier of the dispatched email message.
      - name: deliveryStatus
        type: string
        required: true
        description: Outcome reported by the mail provider (queued, sent, failed).
      - name: sentAt
        type: string
        required: true
        description: Timestamp when the message was handed to the provider.
  - name: sendAccountSuspendedEmail
    serviceName: accountNotification
    description: Notifies the user that their account has been suspended, including the reason.
    params:
      - name: recipientEmail
        type: email
        required: true
        description: Email address the suspension notice is sent to.
      - name: recipientName
        type: string
        required: true
        description: Display name of the account owner used in the greeting.
      - name: suspensionReason
        type: string
        required: true
        description: Plain-language reason shown to the user for the suspension.
      - name: suspendedUntil
        type: string
        required: true
        description: Moment until which the account stays suspended, empty for an indefinite suspension.
    returns:
      - name: messageId
        type: string
        required: true
        description: Identifier of the dispatched email message.
      - name: deliveryStatus
        type: string
        required: true
        description: Outcome reported by the mail provider (queued, sent, failed).
      - name: sentAt
        type: string
        required: true
        description: Timestamp when the message was handed to the provider.
  - name: sendAccountUnsuspendedEmail
    serviceName: accountNotification
    description: Notifies the user that the suspension on their account has been lifted.
    params:
      - name: recipientEmail
        type: email
        required: true
        description: Email address the unsuspension notice is sent to.
      - name: recipientName
        type: string
        required: true
        description: Display name of the account owner used in the greeting.
      - name: unsuspendedAt
        type: string
        required: true
        description: Moment the account suspension was lifted.
    returns:
      - name: messageId
        type: string
        required: true
        description: Identifier of the dispatched email message.
      - name: deliveryStatus
        type: string
        required: true
        description: Outcome reported by the mail provider (queued, sent, failed).
      - name: sentAt
        type: string
        required: true
        description: Timestamp when the message was handed to the provider.
  - name: sendAccountDeletedEmail
    serviceName: accountNotification
    description: Notifies the user that their account has been deleted.
    params:
      - name: recipientEmail
        type: email
        required: true
        description: Email address the deletion confirmation is sent to.
      - name: recipientName
        type: string
        required: true
        description: Display name of the account owner used in the greeting.
      - name: deletedAt
        type: string
        required: true
        description: Moment the account was deleted.
    returns:
      - name: messageId
        type: string
        required: true
        description: Identifier of the dispatched email message.
      - name: deliveryStatus
        type: string
        required: true
        description: Outcome reported by the mail provider (queued, sent, failed).
      - name: sentAt
        type: string
        required: true
        description: Timestamp when the message was handed to the provider.
  - name: verifyRegistration
    serviceName: webauthn
    description: Verifies a WebAuthn registration attestation and returns the credential public key to be stored.
    params:
      - name: credentialId
        type: passkeyCredentialId
        required: true
        description: Credential identifier produced by the authenticator.
      - name: challenge
        type: passkeyChallenge
        required: true
        description: Challenge issued for this registration and expected in the client data.
      - name: clientDataJson
        type: json
        required: true
        description: Client data JSON returned by the browser, carrying the challenge and origin.
      - name: attestationObject
        type: string
        required: true
        description: Base64url CBOR attestation object returned by the authenticator.
    returns:
      - name: verified
        type: boolean
        required: true
        description: Whether the attestation is valid and matches the issued challenge.
      - name: publicKey
        type: passkeyPublicKey
        required: true
        description: Public key extracted from the verified attestation.
      - name: signCount
        type: integer
        required: true
        description: Signature counter reported at registration time.
  - name: verifyRegistration
    params:
      - name: credentialId
        type: passkeyCredentialId
        required: true
        description: Credential identifier produced by the authenticator.
      - name: challenge
        type: passkeyChallenge
        required: true
        description: Challenge issued for this registration and expected in the client data.
      - name: clientDataJson
        type: json
        required: true
        description: Client data JSON returned by the browser, carrying the challenge and origin.
      - name: attestationObject
        type: string
        required: true
        description: Base64url CBOR attestation object returned by the authenticator.
    returns:
      - name: verified
        type: boolean
        required: true
        description: Whether the attestation is valid and matches the issued challenge.
      - name: publicKey
        type: passkeyPublicKey
        required: true
        description: Public key extracted from the verified attestation.
      - name: signCount
        type: integer
        required: true
        description: Signature counter reported at registration time.
  - name: buildCreationOptions
    serviceName: webauthn
    description: Builds the WebAuthn PublicKeyCredentialCreationOptions used by the browser to create a passkey.
    params:
      - name: policy
        type: passkeyPolicy
        required: true
        description: Relying-party policy that drives the registration options.
      - name: accountId
        type: string
        required: true
        description: Account the new credential will be registered to.
      - name: excludeCredentialIds
        type: passkeyCredentialId
        array: true
        description: Credentials the authenticator must refuse to register again.
    returns:
      - name: challenge
        type: passkeyChallenge
        required: true
        description: Random challenge the authenticator must sign.
      - name: rpId
        type: string
        required: true
        description: Relying party identifier the credential is scoped to.
      - name: rpName
        type: string
        required: true
        description: Human-readable relying party name shown by the authenticator.
      - name: userVerification
        type: userVerificationRequirement
        required: true
        description: User verification requirement derived from the policy.
      - name: residentKey
        type: residentKeyRequirement
        required: true
        description: Resident key requirement derived from the policy.
      - name: authenticatorAttachment
        type: authenticatorAttachment
        description: Restriction on the authenticator transport to be used.
      - name: attestation
        type: attestationConveyance
        required: true
        description: Attestation conveyance preference for the ceremony.
      - name: algorithms
        type: integer
        array: true
        required: true
        description: COSE algorithm identifiers the relying party accepts.
      - name: excludeCredentialIds
        type: passkeyCredentialId
        array: true
        description: Credential identifiers excluded from this registration.
      - name: timeoutMs
        type: integer
        required: true
        description: Time budget in milliseconds for the browser ceremony.
      - name: expiresAt
        type: string
        required: true
        description: Moment after which these options and their challenge stop being accepted.
  - name: buildRequestOptions
    serviceName: webauthn
    description: Builds the WebAuthn PublicKeyCredentialRequestOptions used by the browser to authenticate with a passkey.
    params:
      - name: policy
        type: passkeyPolicy
        required: true
        description: Relying-party policy that drives the assertion options.
      - name: allowCredentialIds
        type: passkeyCredentialId
        array: true
        required: true
        description: Credentials allowed to answer this request.
    returns:
      - name: challenge
        type: passkeyChallenge
        required: true
        description: Random challenge the authenticator must sign.
      - name: rpId
        type: string
        required: true
        description: Relying party identifier the credential is scoped to.
      - name: allowCredentialIds
        type: passkeyCredentialId
        array: true
        required: true
        description: Credential identifiers allowed for this assertion.
      - name: userVerification
        type: userVerificationRequirement
        required: true
        description: User verification requirement derived from the policy.
      - name: timeoutMs
        type: integer
        required: true
        description: Time budget in milliseconds for the browser ceremony.
      - name: expiresAt
        type: string
        required: true
        description: Moment after which these options and their challenge stop being accepted.
  - name: storeCreationOptions
    serviceName: passkeyChallengeStore
    description: Persists the generated creation options and their challenge so the later registration can be verified.
    params:
      - name: accountId
        type: string
        required: true
      - name: options
        type: passkeyCreationOptions
        required: true
      - name: expiresAt
        type: string
        required: true
    returns:
      - name: stored
        type: boolean
        required: true
      - name: storedAt
        type: string
        required: true
  - name: storeRequestOptions
    serviceName: passkeyChallengeStore
    description: Persists the generated request options and their challenge so the later assertion can be verified.
    params:
      - name: options
        type: passkeyRequestOptions
        required: true
      - name: expiresAt
        type: string
        required: true
    returns:
      - name: stored
        type: boolean
        required: true
      - name: storedAt
        type: string
        required: true
actors:
  - name: guest
    description: Unauthenticated visitor who can register, verify a password, obtain a session, sign in with a passkey and recover a password.
    permissions:
      - account:registerAccount
      - account:activateAccount
      - password:verifyPassword
      - session:createSession
      - passkey:loginWithPasskey
      - password:requestPasswordReset
      - password:resetPassword
  - name: system
    description: Backend process that reacts to a registration and delivers the activation email.
    permissions:
      - account:sendActivationEmail
  - name: admin
    description: "Administrator who manages account lifecycle: sends activation emails, suspends, unsuspends and deletes accounts"
    permissions:
      - account:sendActivationEmail
      - account:suspendAccount
      - account:unsuspendAccount
      - account:deleteAccount
      - session:revokeSession
  - name: accountOwner
    description: Authenticated owner of an account who manages their own second factor
    permissions:
      - totp:*
      - recoveryCodes:regenerateRecoveryCodes
      - passkey:*
      - password:changePassword
tags:
  - tag: account
    types:
      - string
    fromEvents:
      - accountRegistered
      - activationEmailSent
      - accountActivated
      - accountSuspended
      - accountUnsuspended
      - accountDeleted
      - totpEnrollmentRequested
      - totpEnabled
      - totpCodeVerified
      - totpVerificationFailed
      - totpDisabled
      - recoveryCodesGenerated
      - recoveryCodeUsed
      - recoveryCodeVerificationFailed
      - passkeyVerified
      - passkeyVerificationFailed
      - passkeyLoginSucceeded
      - secondFactorPasskeyRegistered
      - loginPasskeyRegistered
      - passkeyDeleted
      - passwordChanged
      - passwordResetRequested
      - passwordResetCompleted
      - passwordVerified
      - passwordVerificationFailed
      - sessionCreated
      - sessionRevoked
      - passwordInitialized
  - tag: activation
    types:
      - string
    fromEvents:
      - activationEmailSent
      - accountActivated
  - tag: passkey
    types:
      - passkeyCredentialId
    fromEvents:
      - passkeyVerified
      - passkeyVerificationFailed
      - passkeyLoginSucceeded
      - passkeyLoginFailed
      - secondFactorPasskeyRegistered
      - loginPasskeyRegistered
      - passkeyDeleted
  - tag: passwordReset
    types:
      - string
    fromEvents:
      - passwordResetRequested
      - passwordResetCompleted
  - tag: session
    types:
      - sessionId
    fromEvents:
      - sessionCreated
      - sessionRevoked
